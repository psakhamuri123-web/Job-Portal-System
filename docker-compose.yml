services:
  mysql:
    image: mysql:8.4
    container_name: job-portal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: job_portal_db
    ports: ["3306:3306"]
    volumes: [job_mysql:/var/lib/mysql]
  backend:
    build: ./backend
    container_name: job-portal-backend
    depends_on: [mysql]
    ports: ["8081:8081"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/job_portal_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
volumes:
  job_mysql:
